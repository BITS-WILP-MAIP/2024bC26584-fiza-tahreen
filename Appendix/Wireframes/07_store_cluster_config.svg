<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 570" width="1010" height="570" font-family='Helvetica, Arial, sans-serif'>
  <rect width="1010" height="570" fill="#F7F1E8"/>
  <text x="28" y="34" font-size="15" font-weight="bold" fill="#5C2233">Screen 7 — Store cluster configuration</text>
  <text x="28" y="54" font-size="11.5" fill="#6E5B62">The customisation layer. What changes per retailer, and what never does.</text>
  <rect x="28" y="70" width="700" height="470" rx="6" fill="#FFFFFF" stroke="#C9BDB4"/>
  <line x1="28" y1="112" x2="728" y2="112" stroke="#C9BDB4"/>
  <text x="46" y="97" font-size="13" font-weight="bold" fill="#2E2126">Store clusters — configuration</text>
  <rect x="560" y="84" width="150" height="18" rx="9" fill="#7D3348" opacity="0.13"/>
  <text x="635.0" y="96.5" font-size="9.5" font-weight="bold" fill="#7D3348" text-anchor="middle">CUSTOMISATION LAYER</text>
  <text x="46" y="140" font-size="10.5" fill="#6E5B62">Clusters are configured per retailer. The forecasting core does not change — only which stores are grouped, and by what.</text>

  <rect x="46" y="160" width="400" height="228" rx="6" fill="#F7F1E8" stroke="#C9BDB4"/>
  <text x="66" y="184" font-size="11" font-weight="bold" fill="#5C2233">Clustering inputs</text>
  <rect x="66" y="206" width="30" height="16" rx="8" fill="#3F7A5E"/>
  <circle cx="88" cy="214" r="6" fill="#FFFFFF"/>
  <text x="108" y="218" font-size="10.5" fill="#2E2126">Climate zone</text>
  <rect x="66" y="236" width="30" height="16" rx="8" fill="#3F7A5E"/>
  <circle cx="88" cy="244" r="6" fill="#FFFFFF"/>
  <text x="108" y="248" font-size="10.5" fill="#2E2126">Store format &amp; size</text>
  <rect x="66" y="266" width="30" height="16" rx="8" fill="#3F7A5E"/>
  <circle cx="88" cy="274" r="6" fill="#FFFFFF"/>
  <text x="108" y="278" font-size="10.5" fill="#2E2126">Catchment demographics</text>
  <rect x="66" y="296" width="30" height="16" rx="8" fill="#3F7A5E"/>
  <circle cx="88" cy="304" r="6" fill="#FFFFFF"/>
  <text x="108" y="308" font-size="10.5" fill="#2E2126">Historical seasonal curve</text>
  <rect x="66" y="326" width="30" height="16" rx="8" fill="#C9BDB4"/>
  <circle cx="74" cy="334" r="6" fill="#FFFFFF"/>
  <text x="108" y="338" font-size="10.5" fill="#6E5B62">Local competitor density</text>
  <text x="66" y="364" font-size="9" fill="#6E5B62">Competitor density off — data not licensed for this retailer</text>

  <rect x="462" y="160" width="248" height="228" rx="6" fill="#F7F1E8" stroke="#C9BDB4"/>
  <text x="480" y="184" font-size="11" font-weight="bold" fill="#5C2233">Resulting clusters</text>
  <text x="480" y="208" font-size="10" fill="#2E2126">Coastal high-volume</text>
  <text x="694" y="208" font-size="10" fill="#6E5B62" text-anchor="end">38 stores</text>
  <line x1="480" y1="216" x2="694" y2="216" stroke="#C9BDB4" stroke-opacity="0.6"/>
  <text x="480" y="236" font-size="10" fill="#2E2126">Metro standard</text>
  <text x="694" y="236" font-size="10" fill="#6E5B62" text-anchor="end">94 stores</text>
  <line x1="480" y1="244" x2="694" y2="244" stroke="#C9BDB4" stroke-opacity="0.6"/>
  <text x="480" y="264" font-size="10" fill="#2E2126">Regional standard</text>
  <text x="694" y="264" font-size="10" fill="#6E5B62" text-anchor="end">112 stores</text>
  <line x1="480" y1="272" x2="694" y2="272" stroke="#C9BDB4" stroke-opacity="0.6"/>
  <text x="480" y="292" font-size="10" fill="#2E2126">Cold-climate</text>
  <text x="694" y="292" font-size="10" fill="#6E5B62" text-anchor="end">41 stores</text>
  <line x1="480" y1="300" x2="694" y2="300" stroke="#C9BDB4" stroke-opacity="0.6"/>
  <text x="480" y="320" font-size="10" fill="#2E2126">Small format</text>
  <text x="694" y="320" font-size="10" fill="#6E5B62" text-anchor="end">27 stores</text>
  <line x1="480" y1="328" x2="694" y2="328" stroke="#C9BDB4" stroke-opacity="0.6"/>
  <text x="480" y="354" font-size="9" fill="#6E5B62">Clusters below 20 stores are flagged — too few</text>
  <text x="480" y="366" font-size="9" fill="#6E5B62">to forecast reliably.</text>

  <rect x="46" y="406" width="664" height="112" rx="6" fill="#F1E7DC"/>
  <text x="66" y="430" font-size="11" font-weight="bold" fill="#5C2233">Why this screen exists</text>
  <text x="66" y="454" font-size="10.5" fill="#2E2126">Everything on this screen is configuration, not code. The forecasting engine, ranking logic, confidence</text>
  <text x="66" y="472" font-size="10.5" fill="#2E2126">routing and review interface are identical for every customer.</text>
  <text x="66" y="498" font-size="10" fill="#6E5B62">This split is what makes ClearSight a product: fixed development cost is spread across customers, and onboarding a new</text>
  <text x="66" y="512" font-size="10" fill="#6E5B62">retailer is a setup task rather than a build.</text>
  <line x1="734" y1="196" x2="744" y2="196" stroke="#C4462F" stroke-width="1.5"/>
  <text x="748" y="200" font-size="10" fill="#C4462F">Cluster definition is the</text>
  <text x="748" y="213" font-size="10" fill="#C4462F">main per-customer setup</text>
  <text x="748" y="226" font-size="10" fill="#C4462F">cost — and a fixed cost,</text>
  <text x="748" y="239" font-size="10" fill="#C4462F">not a variable one</text>
  <line x1="734" y1="296" x2="744" y2="296" stroke="#C4462F" stroke-width="1.5"/>
  <text x="748" y="300" font-size="10" fill="#C4462F">Minimum cluster size is</text>
  <text x="748" y="313" font-size="10" fill="#C4462F">enforced. Too few stores</text>
  <text x="748" y="326" font-size="10" fill="#C4462F">and the forecast has no</text>
  <text x="748" y="339" font-size="10" fill="#C4462F">statistical basis</text>
  <line x1="734" y1="436" x2="744" y2="436" stroke="#C4462F" stroke-width="1.5"/>
  <text x="748" y="440" font-size="10" fill="#C4462F">This screen is the visual</text>
  <text x="748" y="453" font-size="10" fill="#C4462F">answer to 'how is this a</text>
  <text x="748" y="466" font-size="10" fill="#C4462F">product and not a project</text>
  <text x="748" y="479" font-size="10" fill="#C4462F">for your employer?'</text>

</svg>
