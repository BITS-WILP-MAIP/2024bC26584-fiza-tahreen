<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 580" width="1010" height="580" font-family='Helvetica, Arial, sans-serif'>
  <rect width="1010" height="580" fill="#F7F1E8"/>
  <text x="28" y="34" font-size="15" font-weight="bold" fill="#5C2233">Screen 1. Exit worklist</text>
  <text x="28" y="54" font-size="11.5" fill="#6E5B62">The planner's landing screen. What needs a decision, ordered by what it costs to get wrong.</text>
  <rect x="28" y="70" width="700" height="480" rx="6" fill="#FFFFFF" stroke="#C9BDB4"/>

  <!-- header bar -->
  <line x1="28" y1="112" x2="728" y2="112" stroke="#C9BDB4"/>
  <text x="46" y="97" font-size="13" font-weight="bold" fill="#2E2126">Exit worklist: Summer Outdoor, Wk 6 of exit window</text>
  <rect x="560" y="83" width="150" height="22" rx="4" fill="#F7F1E8" stroke="#C9BDB4"/>
  <text x="572" y="98" font-size="10" fill="#6E5B62">Filter: all clusters ▾</text>

  <!-- summary strip -->
  <text x="46" y="140" font-size="22" font-weight="bold" fill="#5C2233">184</text>
  <text x="46" y="155" font-size="9.5" fill="#6E5B62">items at risk</text>
  <text x="160" y="140" font-size="22" font-weight="bold" fill="#5C2233">$1.2m</text>
  <text x="160" y="155" font-size="9.5" fill="#6E5B62">value at stake</text>
  <text x="285" y="140" font-size="22" font-weight="bold" fill="#B07D2A">31</text>
  <text x="285" y="155" font-size="9.5" fill="#6E5B62">routed to manual</text>
  <text x="420" y="140" font-size="22" font-weight="bold" fill="#3F7A5E">42</text>
  <text x="420" y="155" font-size="9.5" fill="#6E5B62">reviewed today</text>
  <line x1="28" y1="172" x2="728" y2="172" stroke="#C9BDB4"/>

  <!-- column headers -->
  <text x="46" y="192" font-size="9.5" font-weight="bold" fill="#6E5B62">ITEM</text>
  <text x="300" y="192" font-size="9.5" font-weight="bold" fill="#6E5B62">AT STAKE</text>
  <text x="390" y="192" font-size="9.5" font-weight="bold" fill="#6E5B62">RECOMMENDATION</text>
  <text x="580" y="192" font-size="9.5" font-weight="bold" fill="#6E5B62">CONFIDENCE</text>
  <rect x="40" y="206" width="676" height="52" rx="4" fill="#F7F1E8" stroke="#C9BDB4" stroke-opacity="0.6"/>
  <text x="54" y="228" font-size="11.5" font-weight="bold" fill="#2E2126">Kids' rash vest, 5 colours</text>
  <text x="54" y="244" font-size="9.5" fill="#6E5B62">2,400 units · 12 clusters</text>
  <text x="300" y="236" font-size="12" font-weight="bold" fill="#5C2233">$186k</text>
  <text x="390" y="236" font-size="11" fill="#2E2126">Cut 25% now</text>
  <rect x="580" y="224" width="40.4" height="18" rx="9" fill="#3F7A5E" opacity="0.13"/>
  <text x="600.2" y="236.5" font-size="9.5" font-weight="bold" fill="#3F7A5E" text-anchor="middle">High</text>
  <rect x="40" y="262" width="676" height="52" rx="4" fill="#F7F1E8" stroke="#C9BDB4" stroke-opacity="0.6"/>
  <text x="54" y="284" font-size="11.5" font-weight="bold" fill="#2E2126">Beach shade tent 3m</text>
  <text x="54" y="300" font-size="9.5" fill="#6E5B62">890 units · 8 clusters</text>
  <text x="300" y="292" font-size="12" font-weight="bold" fill="#5C2233">$142k</text>
  <text x="390" y="292" font-size="11" fill="#2E2126">Hold 2 weeks, then 30%</text>
  <rect x="580" y="280" width="40.4" height="18" rx="9" fill="#3F7A5E" opacity="0.13"/>
  <text x="600.2" y="292.5" font-size="9.5" font-weight="bold" fill="#3F7A5E" text-anchor="middle">High</text>
  <rect x="40" y="318" width="676" height="52" rx="4" fill="#FFFFFF" stroke="#C9BDB4" stroke-opacity="0.6"/>
  <text x="54" y="340" font-size="11.5" font-weight="bold" fill="#2E2126">Inflatable lounger</text>
  <text x="54" y="356" font-size="9.5" fill="#6E5B62">1,650 units · 14 clusters</text>
  <text x="300" y="348" font-size="12" font-weight="bold" fill="#5C2233">$118k</text>
  <text x="390" y="348" font-size="11" fill="#2E2126">Cut 15% now</text>
  <rect x="580" y="336" width="51.599999999999994" height="18" rx="9" fill="#B07D2A" opacity="0.13"/>
  <text x="605.8" y="348.5" font-size="9.5" font-weight="bold" fill="#B07D2A" text-anchor="middle">Medium</text>
  <rect x="40" y="374" width="676" height="52" rx="4" fill="#F7F1E8" stroke="#C9BDB4" stroke-opacity="0.6"/>
  <text x="54" y="396" font-size="11.5" font-weight="bold" fill="#2E2126">Cooler bag 24L</text>
  <text x="54" y="412" font-size="9.5" fill="#6E5B62">1,100 units · 11 clusters</text>
  <text x="300" y="404" font-size="12" font-weight="bold" fill="#5C2233">$97k</text>
  <text x="390" y="404" font-size="11" fill="#C4462F">No recommendation</text>
  <rect x="580" y="392" width="85.19999999999999" height="18" rx="9" fill="#C4462F" opacity="0.13"/>
  <text x="622.6" y="404.5" font-size="9.5" font-weight="bold" fill="#C4462F" text-anchor="middle">Low, manual</text>
  <rect x="40" y="430" width="676" height="52" rx="4" fill="#FFFFFF" stroke="#C9BDB4" stroke-opacity="0.6"/>
  <text x="54" y="452" font-size="11.5" font-weight="bold" fill="#2E2126">Swim goggles junior</text>
  <text x="54" y="468" font-size="9.5" fill="#6E5B62">3,200 units · 15 clusters</text>
  <text x="300" y="460" font-size="12" font-weight="bold" fill="#5C2233">$76k</text>
  <text x="390" y="460" font-size="11" fill="#2E2126">Cut 20% in 1 week</text>
  <rect x="580" y="448" width="40.4" height="18" rx="9" fill="#3F7A5E" opacity="0.13"/>
  <text x="600.2" y="460.5" font-size="9.5" font-weight="bold" fill="#3F7A5E" text-anchor="middle">High</text>
  <line x1="734" y1="126" x2="744" y2="126" stroke="#C4462F" stroke-width="1.5"/>
  <text x="748" y="130" font-size="10" fill="#C4462F">Ranked by value at stake,</text>
  <text x="748" y="143" font-size="10" fill="#C4462F">not by discount size ,</text>
  <text x="748" y="156" font-size="10" fill="#C4462F">the planner's scarce</text>
  <text x="748" y="169" font-size="10" fill="#C4462F">resource is attention</text>
  <line x1="734" y1="296" x2="744" y2="296" stroke="#C4462F" stroke-width="1.5"/>
  <text x="748" y="300" font-size="10" fill="#C4462F">Low-confidence items are</text>
  <text x="748" y="313" font-size="10" fill="#C4462F">not hidden. They appear</text>
  <text x="748" y="326" font-size="10" fill="#C4462F">in the list, labelled, and</text>
  <text x="748" y="339" font-size="10" fill="#C4462F">routed to manual</text>
  <line x1="734" y1="416" x2="744" y2="416" stroke="#C4462F" stroke-width="1.5"/>
  <text x="748" y="420" font-size="10" fill="#C4462F">Reviewed-today count</text>
  <text x="748" y="433" font-size="10" fill="#C4462F">makes the review itself</text>
  <text x="748" y="446" font-size="10" fill="#C4462F">visible as work done</text>

</svg>
